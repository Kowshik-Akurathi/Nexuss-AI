<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nexuss UI Replica — full render check</title>
    <script>
      try {
        (function () {
          var t = JSON.parse(window.localStorage.getItem("theme") || "null");
          if (t === "light") {
            document.documentElement.classList.remove("dark");
          } else {
            document.documentElement.classList.add("dark");
          }
        })();
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body class="min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/__replica_harness.tsx"></script>
  </body>
</html>
